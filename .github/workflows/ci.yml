name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      # cloudflare-env.d.ts and worker/runtime.d.ts must match wrangler.jsonc.
      - name: Cloudflare types
        run: npm run check:cf-types
      # next build turned into the Worker bundle, then a dry-run deploy, so a
      # change that breaks the Cloudflare build fails here.
      - name: Worker build
        run: npm run build:worker
      - name: Deploy dry run
        run: npm run check:deploy

  # Sign-in, contacts, consent, compose, send, reminders, stop links, privacy
  # between accounts, settings and axe checks, in a real browser on phone and
  # desktop. A local libSQL file and test-mode email: no secrets.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Build
        run: npm run build
      - name: End-to-end tests
        run: npm run test:e2e
      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
