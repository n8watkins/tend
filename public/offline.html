<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f7f5f0" />
    <meta name="color-scheme" content="light" />
    <title>You are offline · Tend</title>
    <link rel="icon" href="/icons/icon-192.png" />
    <!-- The service worker (public/sw.js) shows this page when a page cannot
         load without a connection. It is static and holds no user data. -->
    <style>
      :root {
        --bg: #f7f5f0;
        --surface: #ffffff;
        --ink: #1f2a24;
        --muted: #56615a;
        --line: #d9d5ca;
        --accent: #2f6b4f;
        --accent-hover: #255a41;
        color-scheme: light;
      }
      * {
        box-sizing: border-box;
      }
      html {
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px 16px;
        background: var(--bg);
        color: var(--ink);
        font: 16px/1.5 ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      main {
        width: 100%;
        max-width: 26rem;
        text-align: center;
      }
      svg {
        width: 56px;
        height: 56px;
      }
      h1 {
        margin: 20px 0 8px;
        font: 600 1.75rem/1.2 'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif;
      }
      p {
        margin: 0 0 24px;
        color: var(--muted);
      }
      a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 2.75rem;
        padding: 0.5rem 1.25rem;
        border-radius: 0.75rem;
        background: var(--accent);
        color: #fff;
        font-weight: 600;
        text-decoration: none;
      }
      a:hover {
        background: var(--accent-hover);
      }
      a:focus-visible {
        outline: 3px solid var(--accent);
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <main>
      <svg viewBox="0 0 32 32" aria-hidden="true">
        <rect width="32" height="32" rx="9" fill="#2f6b4f" />
        <path d="M16 25v-9" stroke="#fff" stroke-width="2.2" stroke-linecap="round" />
        <path d="M16 17c0-4.5-3-7.5-8-7.5 0 4.5 3 7.5 8 7.5Z" fill="#fff" />
        <path d="M16 15.5c0-4 2.6-6.8 7-6.8 0 4-2.6 6.8-7 6.8Z" fill="#fff" opacity=".8" />
      </svg>
      <h1>You are offline</h1>
      <p>Tend needs a connection to show your people and messages. Nothing is lost: check your connection, then try again.</p>
      <a href="">Try again</a>
    </main>
  </body>
</html>
